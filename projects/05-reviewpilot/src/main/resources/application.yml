server:
  port: ${SERVER_PORT:8085}
  address: 127.0.0.1
spring:
  application:
    name: reviewpilot
  datasource:
    url: ${REVIEWPILOT_DB_URL:jdbc:h2:file:./data/reviewpilot/reviews;DB_CLOSE_ON_EXIT=FALSE}
    username: ${REVIEWPILOT_DB_USERNAME:sa}
    password: ${REVIEWPILOT_DB_PASSWORD:}
  sql:
    init:
      mode: always
reviewpilot:
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
