services:
  research-crew-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research_crew
      POSTGRES_USER: research_crew
      POSTGRES_PASSWORD: ${RESEARCH_CREW_DB_PASSWORD:-research-crew-local-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - research-crew-checkpoints:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_crew -d research_crew"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  research-crew-checkpoints:
