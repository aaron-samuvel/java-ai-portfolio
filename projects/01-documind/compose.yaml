services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DOCUMIND_DB_URL: jdbc:postgresql://postgres:5432/documind
      DOCUMIND_DB_USERNAME: documind
      DOCUMIND_DB_PASSWORD: ${POSTGRES_PASSWORD:-documind-local-only}
      DOCUMIND_STORAGE_DIRECTORY: /app/data/documind/uploads
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "${DOCUMIND_PORT:-8081}:8081"
    volumes:
      - documents:/app/data/documind/uploads
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  documents:

