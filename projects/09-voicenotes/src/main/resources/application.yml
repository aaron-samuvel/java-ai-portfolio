server:
  port: ${SERVER_PORT:8089}
  address: 127.0.0.1
spring:
  application:
    name: voicenotes
  datasource:
    url: ${VOICENOTES_DB_URL:jdbc:h2:file:./data/voicenotes/transcripts;DB_CLOSE_ON_EXIT=FALSE}
    username: ${VOICENOTES_DB_USERNAME:sa}
    password: ${VOICENOTES_DB_PASSWORD:}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
voicenotes:
  whisper-binary: ${WHISPER_CPP_BINARY:}
  whisper-model: ${WHISPER_CPP_MODEL:}
  ffmpeg-binary: ${FFMPEG_BINARY:}
