server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8086}
spring:
  application:
    name: fraudguard
  datasource:
    url: ${FRAUDGUARD_DB_URL:jdbc:h2:file:./data/fraudguard;AUTO_SERVER=TRUE}
    username: ${FRAUDGUARD_DB_USERNAME:sa}
    password: ${FRAUDGUARD_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
